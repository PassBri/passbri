<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-label="Sobre mí: soy docente de aula; pienso como investigador y construyo como desarrollador. Docente de Educación Física, investigador, desarrollador y artista plástico. 22 años en la educación pública colombiana. Licenciatura en Educación Física. Aprendiendo Tecnólogo en Análisis y Desarrollo de Software en el SENA. Santander, Colombia.">
