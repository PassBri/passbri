y="112" width="4" height="40" rx="2" fill="#c239b3"/><text x="76" y="140" font-size="16" letter-spacing="4" font-weight="600" fill="#c239b3">ARTE</text><text x="56" y="190" font-size="19" fill="#a9b8d0">Pinto desde niño, formado por mi padre. Trabajo</text><text x="56" y="219" font-size="19" fill="#a9b8d0">óleo sobre lienzo con conceptos abstractos y he</text><text x="56" y="248" font-size="19" fill="#a9b8d0">expuesto en el Museo de Arte Moderno de</text><text x="56" y="277" font-size="19" fill="#a9b8d0">Bucaramanga. Mi serie de frailejones habla del</text><text x="56" y="306" font-size="19" fill="#a9b8d0">páramo y de la violencia extractiva.</text><rect x="556" y="112" width="4" height="40" rx="2" fill="#5fd39a"/><text x="576" y="140" font-size="16" letter-spacing="4" font-weight="600" fill="#5fd39a">TERRITORIO</text><text x="556" y="190" font-size="19" fill="#a9b8d0">Defiendo los páramos de Santander</text><text x="556" y="219" font-size="19" fill="#a9b8d0">y participo en el debate público</text><text x="556" y="248" font-size="19" fill="#a9b8d0">sobre la educación en Colombia.</text></g></svg>